# full: a development machine I fully control (macOS, Linux desktop, Windows).

[bootstrap.apt.sources.nushell]
uris = "https://apt.fury.io/nushell/"
suites = "/"
key = "https://apt.fury.io/nushell/gpg.key"
fingerprint = "F7939B750FA1789832D67A809E755FC365BF00D5"

[bootstrap.packages]
# macOS (mise installs formulae and casks itself; Homebrew is optional)
"brew:nushell" = { os = "macos" }
"brew-cask:ghostty" = { os = "macos" }
# Third-party tap: mise evaluates its Ruby definition, which needs Ruby >= 3
# on PATH (the ruby tool below; install.sh provides it on a fresh Mac).
"brew-cask:nikitabobko/tap/aerospace" = { os = "macos" }
# macOS and Linux: font casks install into ~/Library/Fonts or ~/.local/share/fonts
"brew-cask:font-maple-mono-nf-cn" = { os = ["macos", "linux"] }

# macOS apps and tools beyond the shell setup; trim to what every Mac needs.
# CLI (Homebrew formulae)
"brew:git" = { os = "macos" }
"brew:wget" = { os = "macos" }
"brew:ffmpeg" = { os = "macos" }
# Development
"brew-cask:visual-studio-code" = { os = "macos" }
# Docker Desktop also provides the docker CLI and compose.
"brew-cask:docker-desktop" = { os = "macos" }
"brew-cask:dbx" = { os = "macos" }
"brew-cask:drawio" = { os = "macos" }
"brew-cask:figma" = { os = "macos" }
"brew-cask:gcloud-cli" = { os = "macos" }
# AI
"brew-cask:claude" = { os = "macos" }
"brew-cask:claude-code" = { os = "macos" }
"brew-cask:chatgpt" = { os = "macos" }
"brew-cask:codex" = { os = "macos" }
"brew-cask:deepseek-harness" = { os = "macos" }
# Network
# netbird-ui (netbirdio/tap) stays a manual `brew install`: mise cannot evaluate its cask.
# Chat and meetings
"brew-cask:wechat" = { os = "macos" }
"brew-cask:qq" = { os = "macos" }
"brew-cask:feishu" = { os = "macos" }
"brew-cask:tencent-meeting" = { os = "macos" }
"brew-cask:telegram" = { os = "macos" }
"brew-cask:whatsapp" = { os = "macos" }
"brew-cask:discord" = { os = "macos" }
"brew-cask:zoom" = { os = "macos" }
# Office and reading
"brew-cask:microsoft-edge" = { os = "macos" }
"brew-cask:obsidian" = { os = "macos" }
"brew-cask:zotero" = { os = "macos" }
# Media and design
"brew-cask:vlc" = { os = "macos" }
# Utilities
"brew-cask:bitwarden" = { os = "macos" }
"brew-cask:utools" = { os = "macos" }
"brew-cask:jordanbaird-ice" = { os = "macos" }
"brew-cask:scroll-reverser" = { os = "macos" }
# Fonts
"brew-cask:font-cascadia-code" = { os = "macos" }

# Linux
"apt:git" = "latest"
"apt:curl" = "latest"
"apt:build-essential" = "latest"
"apt:unzip" = "latest"
"apt:fontconfig" = "latest"
"apt:fonts-noto-cjk" = "latest"
"apt:fonts-noto-color-emoji" = "latest"
# Not in the Debian/Ubuntu archives; the snap needs classic confinement.
"snap:ghostty" = { classic = true }
"apt:nushell" = "latest"

# Windows
"winget:Git.Git" = "latest"
"winget:Nushell.Nushell" = "latest"
"winget:Microsoft.PowerShell" = "latest"
"winget:LLVM.LLVM" = "latest"
"scoop:nerd-fonts/Maple-Mono-NF-CN" = "latest"

[bootstrap.user]
login_shell = "nu"

[tools]
ruby = { version = "latest", os = "macos" }
node = "latest"
pnpm = "latest"
bun = "latest"
gh = "latest"
just = "latest"
tree-sitter = "latest"
yazi = "latest"
ripgrep = "latest"
fd = "latest"
fzf = "latest"
jq = "latest"
bat = "latest"
zoxide = "latest"
dust = "latest"
duf = "latest"
fastfetch = "latest"
java = "temurin-17"
rust = "latest"
cmake = "latest"
pixi = "latest"
ruff = "latest"
biome = "latest"
typst = "latest"
resvg = "latest"
7zip = "latest"
trzsz-ssh = "latest"
# The registry's default backend is a different npm package.
"aqua:anomalyco/opencode" = "latest"
"github:googleworkspace/cli" = "latest"
"npm:@playwright/cli" = "latest"

[dotfiles.nushell-env]
source = "~/.dotfiles/shell/nushell/env.nu"
variants = [
  { os = "macos", target = "~/Library/Application Support/nushell/env.nu" },
  { os = "linux", target = "~/.config/nushell/env.nu" },
  { os = "windows", target = "~/AppData/Roaming/nushell/env.nu" },
]

[dotfiles.nushell-config]
source = "~/.dotfiles/shell/nushell/config.nu"
variants = [
  { os = "macos", target = "~/Library/Application Support/nushell/config.nu" },
  { os = "linux", target = "~/.config/nushell/config.nu" },
  { os = "windows", target = "~/AppData/Roaming/nushell/config.nu" },
]

[dotfiles.nvim]
source = "~/.dotfiles/tools/nvim"
variants = [
  { os = "unix", target = "~/.config/nvim" },
  { os = "windows", target = "~/AppData/Local/nvim" },
]

[dotfiles.yazi]
source = "~/.dotfiles/tools/yazi"
variants = [
  { os = "unix", target = "~/.config/yazi" },
  { os = "windows", target = "~/AppData/Roaming/yazi/config" },
]

[dotfiles.ghostty]
source = "~/.dotfiles/tools/ghostty"
variants = [{ os = "unix", target = "~/.config/ghostty" }]

[dotfiles.aerospace]
source = "~/.dotfiles/tools/aerospace"
variants = [{ os = "macos", target = "~/.config/aerospace" }]

[dotfiles.pwsh]
source = "~/.dotfiles/shell/pwsh/Microsoft.PowerShell_profile.ps1"
variants = [
  { os = "windows", target = "~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1" },
]

# Shared agent instructions and skills (bash only for now).
[tasks.bootstrap]
run = "bash ~/.dotfiles/agents/install.sh"
run_windows = "echo skip agents/install.sh on Windows"
