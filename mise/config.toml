# Shared by every preset. Select a preset with `mise -E <preset> bootstrap`;
# install.sh / install.ps1 save the choice to miserc.local.toml.

[settings.dotfiles]
# Real symlinks on Windows too (needs Developer Mode or an elevated shell).
windows_symlinks = true

[tools]
starship = "latest"
carapace = "latest"
neovim = "latest"
lazygit = "latest"
uv = "latest"
# btop ships prebuilt binaries for Linux only; macOS gets it from brew below.
btop = { version = "latest", os = "linux" }

[bootstrap.packages]
"brew:btop" = { os = "macos" }

[dotfiles]
"~/.config/starship.toml" = "~/.dotfiles/shell/starship.toml"
"~/.gitconfig" = "~/.dotfiles/tools/git/.gitconfig"
